[project]
name = "aml-task-assist"
version = "0.6.0"
description = "AML任务助手"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-mysql[pymysql]==3.0.0",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1.1,<2",
  "redis>=5,<7",
  "python-multipart>=0.0.20,<1",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["task_assist*", "learning*"]

[tool.setuptools.package-data]
task_assist = ["widget/*.html", "widget/*.css", "widget/*.js"]
